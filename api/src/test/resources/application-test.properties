spring.datasource.api.driver-class-name=org.h2.Driver
spring.datasource.api.url=jdbc:h2:mem:api;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MYSQL;NON_KEYWORDS=USER
spring.datasource.api.username=sa
spring.datasource.api.password=sa
spring.datasource.api.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.datasource.api.hibernate.ddl-auto=create-drop
spring.datasource.analytics.driver-class-name=org.h2.Driver
spring.datasource.analytics.url=jdbc:h2:mem:analytics;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS AL
spring.datasource.analytics.username=sa
spring.datasource.analytics.password=sa
spring.datasource.analytics.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.datasource.analytics.hibernate.ddl-auto=none

