# External database migrations only. For local Fable use node scripts/local-dev.mjs start from the repository root.
services:
  schema_api:
    image: redgate/flyway:13.5@sha256:b4452f1052daf6c365352257a8b9d9aa927be00e8f3c1ac9a031ef9dd5e819d7
    container_name: fable-db-flyway
    command: -locations=filesystem:/flyway/migrations -url=${DB_CONN_URL_DOCKER} -schemas=migration -user=${DB_USER} -password=${DB_PWD} -connectRetries=60 migrate
    volumes:
      - ./schema/api:/flyway/migrations
    profiles:
      - na

  schema_analytics:
    image: redgate/flyway:13.5@sha256:b4452f1052daf6c365352257a8b9d9aa927be00e8f3c1ac9a031ef9dd5e819d7
    container_name: fable-analytics-db-flyway
    command: -locations=filesystem:/flyway/migrations -url=${ANALYTICS_DB_CONN_URL_DOCKER} -schemas=migration -user=${ANALYTICS_DB_USER} -password=${ANALYTICS_DB_PWD} -connectRetries=60 migrate
    volumes:
      - ./schema/analytics:/flyway/migrations
    profiles:
      - na

