include classpath("application.conf")

// Local development only; this service has no published host port.
node-address { protocol = http, host = "*", port = 9324, context-path = "" }
rest-sqs { enabled = true, bind-port = 9324, bind-hostname = "0.0.0.0", sqs-limits = strict }
rest-stats.enabled = false
aws { region = "ap-south-1", accountId = "000000000000" }

// Queue configuration alone is insufficient: retain payloads and receipt state too.
messages-storage { enabled = true, uri = "jdbc:h2:/data/elasticmq;WRITE_DELAY=0" }
queues {
  tour_app_queue_dlq { }
  tour_app_queue {
    defaultVisibilityTimeout = 90 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "tour_app_queue_dlq", maxReceiveCount = 5 }
  }
}
