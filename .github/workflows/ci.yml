name: Baseline CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: api/pom.xml

      - name: Verify API
        working-directory: api
        run: bash ./mvnw --batch-mode --no-transfer-progress verify

      - name: Verify generated API contract is committed
        run: git diff --exit-code -- api/gen/api-contract.d.ts

      - name: Verify API contract consumers match generated output
        run: node scripts/sync-api-contracts.mjs --check

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app/workspace
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node 22.23.2
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Activate Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build shared package
        run: yarn workspace @fable/common build

      - name: Lint frontend packages
        run: |
          yarn workspace @fable/common lint
          yarn workspace @fable/client lint
          yarn workspace @fable/ext-tour lint

      - name: Test shared package
        run: yarn workspace @fable/common test --runInBand

      - name: Test client
        env:
          CI: "true"
        run: yarn workspace @fable/client test --watchAll=false --runInBand

      - name: Install Playwright Chromium
        run: yarn test:e2e:install --with-deps

      - name: Run editor browser characterization
        env:
          CI: "true"
        run: yarn test:e2e

      - name: Test extension
        run: yarn workspace @fable/ext-tour test --runInBand

      - name: Build extension
        run: yarn workspace @fable/ext-tour build-local

      - name: Verify actual extension capture and recovery
        env:
          CI: "true"
          FABLE_EXTENSION_PATH: packages/ext-tour/build
        run: node node_modules/@playwright/test/cli.js test --config playwright.extension.config.ts

      - name: Build client
        env:
          CI: "false"
        run: yarn workspace @fable/client build-staging

  product:
    name: Local product routes and queue integration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node 22.23.2
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Bootstrap the isolated product stack
        run: node scripts/local-dev.mjs start

      - name: Install browser test dependencies
        working-directory: app/workspace
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile
          yarn test:e2e:install --with-deps

      - name: Verify actual product routes
        working-directory: app/workspace
        env:
          CI: "true"
        run: node node_modules/@playwright/test/cli.js test --config playwright.product.config.ts

      - name: Verify actual queue redrive and shutdown
        run: >-
          docker run --rm --network fable-local_local
          --mount "type=bind,source=${{ github.workspace }}/jobs/scripts,target=/usr/sqs_jobs/scripts,readonly"
          --entrypoint node fable-local-jobs:phase0 scripts/verify-local-queue.js

      - name: Verify durable infrastructure restart
        run: node scripts/local-dev.mjs verify-restart

      - name: Verify existing product data after restart
        working-directory: app/workspace
        env:
          CI: "true"
        run: node node_modules/@playwright/test/cli.js test --config playwright.product.config.ts

      - name: Show diagnostics
        if: failure()
        run: node scripts/local-dev.mjs logs

      - name: Stop local services
        if: always()
        run: node scripts/local-dev.mjs stop

  jobs:
    name: Jobs (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: jobs
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node 22.23.2
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: jobs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint jobs
        run: npm run lint

      - name: Test jobs
        run: docker build --target test --tag flowtale-jobs:test .

      - name: Build jobs
        run: npm run build

      - name: Build production container
        run: docker build --tag flowtale-jobs:ci .
